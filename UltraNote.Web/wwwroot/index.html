<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UltraNote</title>
    <!-- Prod (todos os 3 domínios) serve sob /ultranote/; dev local serve na raiz. O nginx
         de produção reescreve o href abaixo pra "/ultranote/" na própria resposta (ver
         sub_filter em nginx.conf) — nada de JS tentando corrigir isso depois: o preload
         scanner do navegador começa a buscar os recursos referenciados no HTML antes mesmo
         de um <script> inline rodar, então um fix client-side perde a corrida em alguns
         carregamentos. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="_content/UltraNote.UI/ultranote.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="UltraNote.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ultranote-theme')
                    || ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg,#f5f3ef);font-family:system-ui,-apple-system,sans-serif;">
            <div class="splash-lockup">
                <div class="splash-glyph">
                    <svg viewBox="0 0 48 48" width="64" height="64" style="display:block;overflow:visible;">
                        <defs>
                            <linearGradient id="splashDoc" x1="0" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
                                <stop offset="0" stop-color="#E7BE55" />
                                <stop offset="1" stop-color="#C4892C" />
                            </linearGradient>
                            <mask id="splashMask">
                                <path d="M11 4 h17 l9 9 v30 a1 1 0 0 1 -1 1 h-24 a1 1 0 0 1 -1 -1 v-38 a1 1 0 0 1 1 -1 z" fill="#fff" />
                                <path d="M28 5 v8 h8" fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round" />
                                <path d="M16 24 h15 M16 30 h15 M16 36 h10" stroke="#000" stroke-width="2.8" stroke-linecap="round" />
                            </mask>
                        </defs>
                        <rect width="48" height="48" fill="url(#splashDoc)" mask="url(#splashMask)" />
                    </svg>
                    <svg class="splash-spark" viewBox="0 0 24 24" width="17" height="17" style="top:-9px;right:-11px;animation-delay:0s;"><path d="M12 0 C13 7 17 11 24 12 C17 13 13 17 12 24 C11 17 7 13 0 12 C7 11 11 7 12 0 Z" fill="#F6C445" /></svg>
                    <svg class="splash-spark" viewBox="0 0 24 24" width="11" height="11" style="bottom:-4px;left:-12px;animation-delay:.6s;"><path d="M12 0 C13 7 17 11 24 12 C17 13 13 17 12 24 C11 17 7 13 0 12 C7 11 11 7 12 0 Z" fill="#F6C445" /></svg>
                    <svg class="splash-spark" viewBox="0 0 24 24" width="9" height="9" style="top:23px;right:-16px;animation-delay:1.1s;"><path d="M12 0 C13 7 17 11 24 12 C17 13 13 17 12 24 C11 17 7 13 0 12 C7 11 11 7 12 0 Z" fill="#F6C445" /></svg>
                    <svg class="splash-spark" viewBox="0 0 24 24" width="7" height="7" style="top:1px;left:-15px;animation-delay:1.45s;"><path d="M12 0 C13 7 17 11 24 12 C17 13 13 17 12 24 C11 17 7 13 0 12 C7 11 11 7 12 0 Z" fill="#EEA92E" /></svg>
                </div>
                <span class="splash-word">UltraNote</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted,#8b8685)">Carregando…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
